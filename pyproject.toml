[project]
name = "actuarial"
version = "0.0.3"
description = "Actuarial Modeling"
authors = [{ name = "Jeff Maxey", email = "jeff.maxey@proton.me" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.10,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "asttokens>=3.0.1",
    "black>=26.5.1",
    "dash>=4.1.0",
    "dash-ag-grid>=35.2.0",
    "dash-iconify>=0.1.2",
    "dash-mantine-components>=2.7.0",
    "fastapi>=0.136.3",
    "flake8>=7.3.0",
    "flask>=3.1.3",
    "libcst>=1.8.6",
    "mypy>=2.1.0",
    "myst-parser>=4.0.1",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "psutil>=7.2.2",
    "pyodbc>=5.3.0",
    "pytest>=9.0.3",
    "pytest-benchmark>=5.2.3",
    "pytest-cov>=7.1.0",
    "pytest-coverage>=0.0",
    "quantlib>=1.42.1",
    "ruff>=0.15.15",
    "scipy>=1.15.3",
    "sqlalchemy>=2.0.50",
    "ty>=0.0.40",
    "urllib3>=2.7.0",
]

[project.urls]
Homepage = "https://jeffmaxey.github.io/actuarial/"
Repository = "https://github.com/jeffmaxey/actuarial"
Documentation = "https://jeffmaxey.github.io/actuarial/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "mypy>=1.19.1",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["actuarial"]

[tool.mypy]
files = ["actuarial"]
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["actuarial"]
